<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Galaxy Quiz • Vocabulary Challenge</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --glow: #78ffd6;
    --accent: #a8ff78;
    --purple: #4a00e0;
    --dark: #0f001a;
    --card: rgba(12, 10, 40, 0.9);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #1a0033, #000000 70%);
    color: #e6e6ff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .container{
    max-width:800px;
    width:100%;
    background:var(--card);
    border-radius:28px;
    padding:40px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.9);
    border:1px solid rgba(120,255,214,0.25);
    position:relative;
    overflow:hidden;
  }
  .container::before{
    content:'';
    position:absolute;
    inset:-200px;
    background:radial-gradient(circle at top, rgba(120,255,214,0.15), transparent 60%);
    opacity:0.8;
    pointer-events:none;
  }
  h1{
    text-align:center;
    font-size:2.2rem;
    margin-bottom:8px;
    background: linear-gradient(120deg, #a8ff78, #78ffd6, #ff8aff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .subtitle{
    text-align:center;
    color:#a5b4fc;
    margin-bottom:20px;
    font-size:0.95em;
  }
  .badge-row{ display:flex; justify-content:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; font-size:0.9em; }
  .badge{ padding:6px 12px; border-radius:999px; border:1px solid rgba(120,255,214,0.4); background:rgba(15,23,42,0.7); }

  #statusMessage{ text-align:center; margin-top:12px; font-size:1.0em; }
  #quizArea{ margin-top:10px; }
  #quizWord{ text-align:center; font-size:1.8rem; margin-bottom:10px; font-weight:700; }
  #questionInfo{ text-align:center; font-size:0.95em; color:#c4c9ff; margin-bottom:18px; }
  #quizOptions{ display:grid; gap:12px; margin-bottom:18px; }
  .option-btn{
    padding:12px 16px;
    border-radius:12px;
    border:1px solid rgba(148,163,184,0.6);
    background:rgba(15,23,42,0.9);
    color:#e2e8f0;
    font-size:1em;
    text-align:left;
    cursor:pointer;
    transition:0.18s;
  }
  .option-btn:hover{ transform: translateY(-2px); box-shadow:0 10px 20px rgba(15,23,42,0.7); border-color: rgba(120,255,214,0.7); }
  .option-btn.correct{ background: rgba(22,163,74,0.25); border-color:#22c55e; }
  .option-btn.wrong{ background: rgba(239,68,68,0.20); border-color:#f97373; }
  #quizResult{ text-align:center; font-size:1.05em; min-height:1.2em; margin-bottom:10px; }
  .button-row{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
  .btn{ padding:10px 18px; border-radius:999px; border:none; cursor:pointer; font-weight:600; font-size:0.95em; display:inline-flex; align-items:center; gap:8px; transition:0.18s; }
  #nextBtn{ background: linear-gradient(120deg, #78ffd6, #a8ff78); color:#0f172a; display:none; }
  #nextBtn:hover{ transform: translateY(-2px); box-shadow:0 10px 25px rgba(120,255,214,0.45); }
  #backBtn{ background: rgba(15,23,42,0.9); color:#e2e8f0; border:1px solid rgba(148,163,184,0.6); }
  #backBtn:hover{ transform: translateY(-2px); box-shadow:0 10px 25px rgba(15,23,42,0.7); }
  #finalScore{ text-align:center; margin-top:18px; font-size:1.05em; }
  #statusWarning{ color:#f97373; font-weight:600; }
</style>
</head>
<body>

<div class="container">
  <h1>Galaxy Quiz</h1>
  <p class="subtitle">Test the words you collected in One-Minute Magic Reading.</p>

  <div class="badge-row">
    <div class="badge" id="wordCountBadge">Words collected: 0</div>
    <div class="badge" id="questionCountBadge">Questions: 0</div>
  </div>

  <div id="statusMessage"></div>

  <div id="quizArea" style="display:none;">
    <div id="quizWord"></div>
    <div id="questionInfo"></div>
    <div id="quizOptions"></div>
    <div id="quizResult"></div>

    <div class="button-row">
      <button class="btn" id="backBtn" type="button">⟵ Back to Reading</button>
      <button class="btn" id="nextBtn" type="button">Next Question ⟶</button>
    </div>

    <div id="finalScore"></div>
  </div>
</div>

<!-- Sounds -->
<audio id="correctSound" src="https://cdn.pixabay.com/download/audio/2021/09/16/audio_5f49e0e1c0.mp3?filename=correct-answer-111.wav"></audio>
<audio id="wrongSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0cc2f60365.mp3?filename=wrong-answer-126.wav"></audio>
<audio id="nextSound" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_a0d9c0e4de.mp3?filename=page-next-110936.mp3"></audio>

<script>
/* ======= Data ======= */
const vocabList = JSON.parse(localStorage.getItem('vocabList')) || [];
let quizWords = [];
let quizIndex = 0;
let score = 0;

/* ======= DOM ======= */
const statusMessage = document.getElementById('statusMessage');
const quizArea = document.getElementById('quizArea');
const quizWordEl = document.getElementById('quizWord');
const questionInfo = document.getElementById('questionInfo');
const quizOptions = document.getElementById('quizOptions');
const quizResult = document.getElementById('quizResult');
const finalScore = document.getElementById('finalScore');
const nextBtn = document.getElementById('nextBtn');
const backBtn = document.getElementById('backBtn');
const wordCountBadge = document.getElementById('wordCountBadge');
const questionCountBadge = document.getElementById('questionCountBadge');

const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const nextSound = document.getElementById('nextSound');

/* ======= Initialize ======= */
wordCountBadge.textContent = `Words collected: ${vocabList.length}`;

if (vocabList.length < 5) {
  statusMessage.innerHTML = `<span id="statusWarning">You need at least 5 collected words to start the Galaxy Quiz.</span><br>
  Go back, double-click more words in the story, then return here.`;
  questionCountBadge.textContent = 'Questions: 0';
} else {
  buildQuizSet();
  quizArea.style.display = 'block';
}

/* ======= Build Quiz ======= */
function buildQuizSet() {
  quizWords = vocabList.slice();
  shuffleArray(quizWords);
  quizIndex = 0;
  score = 0;
  questionCountBadge.textContent = `Questions: ${quizWords.length}`;
  loadQuizQuestion();
}

/* ======= Load Question ======= */
function loadQuizQuestion() {
  nextBtn.style.display = 'none';
  quizResult.textContent = '';
  finalScore.textContent = '';

  const current = quizWords[quizIndex];
  if (!current) return finishQuiz();

  quizWordEl.textContent = current.word;
  questionInfo.textContent = `Question ${quizIndex + 1} of ${quizWords.length}`;

  const correctMeaning = current.en;
  let options = [correctMeaning];

  const pool = vocabList.filter(v => v.en !== correctMeaning).map(v => v.en);
  shuffleArray(pool);

  for (let i = 0; i < pool.length && options.length < 4; i++) {
    options.push(pool[i]);
  }

  shuffleArray(options);

  quizOptions.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.className = 'option-btn';
    btn.onclick = () => handleAnswer(btn, opt, correctMeaning);
    quizOptions.appendChild(btn);
  });
}

/* ======= Handle Answer ======= */
function handleAnswer(button, selected, correct) {
  quizOptions.querySelectorAll('button').forEach(b => b.disabled = true);

  if (selected === correct) {
    button.classList.add('correct');
    quizResult.textContent = 'Correct!';
    quizResult.style.color = '#4ade80';
    score++;
    playSound(correctSound);
  } else {
    button.classList.add('wrong');
    quizResult.textContent = 'Wrong!';
    quizResult.style.color = '#f97373';
    playSound(wrongSound);

    quizOptions.querySelectorAll('button').forEach(b => {
      if (b.textContent === correct) b.classList.add('correct');
    });
  }

  nextBtn.style.display = 'inline-flex';
}

/* ======= Next Button ======= */
nextBtn.onclick = () => {
  playSound(nextSound);
  quizIndex++;
  if (quizIndex < quizWords.length)
    loadQuizQuestion();
  else
    finishQuiz();
};

/* ======= Finish Quiz ======= */
function finishQuiz() {
  quizWordEl.textContent = 'Quiz Finished!';
  quizOptions.innerHTML = '';
  quizResult.textContent = '';
  nextBtn.style.display = 'none';

  const percent = Math.round((score / quizWords.length) * 100);
  let comment =
    percent === 100 ? "Outstanding! Your galaxy is shining bright."
    : percent >= 70 ? "Great job! Keep growing your galaxy."
    : percent >= 40 ? "Not bad. Review the words and try again."
    : "This is the start. Learn the words and replay the quiz.";

  finalScore.innerHTML = `Your Score: <strong>${score}/${quizWords.length}</strong> (${percent}%)<br>${comment}`;
}

/* ======= Back Button — ALWAYS go to story-home.html ======= */
backBtn.onclick = () => {
  window.location.href = 'story-home.html';
};

/* ======= Utils ======= */
function playSound(sound) {
  sound.currentTime = 0;
  sound.play().catch(() => {});
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}
</script>
</body>
</html>
